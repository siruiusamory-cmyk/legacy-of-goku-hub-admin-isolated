name: Frontend verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: google-chrome --version
      - run: npm run site:fixture
      - run: node tools/site/build.js --fixture --empty
      - run: node tools/site/build.js --fixture --unfeatured
      - run: node tools/site/build.js --fixture --external
      - run: npm run test:browser
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - run: npx playwright test --config playwright.admin.config.js
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-verification
          path: |
            test-results/
            playwright-report/
          retention-days: 14
