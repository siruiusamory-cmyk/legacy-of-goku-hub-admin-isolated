name: Legacy metadata PR (manual migration only)
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: catalog-writer
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      branch: ${{ steps.pr.outputs.pull-request-number && 'maintenance/github-metadata' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/
          key: github-metadata-${{ github.run_id }}
          restore-keys: github-metadata-
      - run: npm ci --ignore-scripts
      - run: npm run refresh
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run build
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        id: pr
        with:
          token: ${{ github.token }}
          branch: maintenance/github-metadata
          add-paths: state/
          commit-message: Refresh GitHub release metadata
          title: Refresh GitHub release metadata
          body: |
            Automated GitHub release and availability refresh. Review report artifact in the workflow run.
            Previous release data is retained on errors. Merge persists this snapshot for future builds.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: catalog-refresh
          path: |
            dist/
            report.json
          if-no-files-found: error
          retention-days: 30
  checks:
    needs: refresh
    if: needs.refresh.outputs.branch != ''
    permissions:
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$PR_BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ needs.refresh.outputs.branch }}
